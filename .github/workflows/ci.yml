name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push makes an in-flight run obsolete; cancel it rather than queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npx tsc --build

      - name: Test
        run: node --test $(find packages -path '*/dist/*' -name '*.test.js')
